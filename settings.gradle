pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'nifte'

def supportedVersionsFile = file('supported-versions.txt')
if (!supportedVersionsFile.file) {
	throw new GradleException("Missing supported-versions.txt")
}

def supportedMinecraftVersions = []
def seenMinecraftVersions = [] as Set
supportedVersionsFile.eachLine { line, lineNumber ->
	def trimmed = line.trim()
	if (trimmed.isEmpty() || trimmed.startsWith('#')) {
		return
	}

	def parts = trimmed.split(/\s+/)
	if (parts.length != 4) {
		throw new GradleException("supported-versions.txt:${lineNumber}: expected 'minecraft fabric-api cloth-config mod-menu'")
	}

	def minecraft = parts[0]
	if (!(minecraft ==~ /[0-9]+(\.[0-9]+)+/)) {
		throw new GradleException("supported-versions.txt:${lineNumber}: '${minecraft}' is not a Minecraft version")
	}
	if (!seenMinecraftVersions.add(minecraft)) {
		throw new GradleException("supported-versions.txt:${lineNumber}: Minecraft ${minecraft} is listed more than once")
	}

	supportedMinecraftVersions << [
		minecraft: minecraft,
		fabricApi: parts[1],
		clothConfig: parts[2],
		modMenu: parts[3]
	]
}

if (supportedMinecraftVersions.isEmpty()) {
	throw new GradleException("supported-versions.txt does not list any Minecraft versions")
}

def devProperties = new Properties()
file('gradle.properties').withInputStream { devProperties.load(it) }
def devMinecraftVersion = devProperties.getProperty('minecraft_version')
if (supportedMinecraftVersions.find { it.minecraft == devMinecraftVersion } == null) {
	throw new GradleException("minecraft_version=${devMinecraftVersion} in gradle.properties is not listed in supported-versions.txt")
}

gradle.ext.supportedMinecraftVersions = supportedMinecraftVersions

supportedMinecraftVersions.each { version ->
	if (version.minecraft == devMinecraftVersion) {
		return
	}

	def projectName = "mc${version.minecraft.replace('.', '_')}"
	def projectDirectory = file("versions/${version.minecraft}")
	projectDirectory.mkdirs()
	include projectName
	project(":${projectName}").projectDir = projectDirectory
	project(":${projectName}").buildFileName = '../minecraft-version.gradle'
}
